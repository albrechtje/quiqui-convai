# Speech Acts, assign the illocutionary act (Bach & Harnish categories)
- question: |
    Which type of illocutionary speech act is each utterance?
  type: matching
  answers:
    - "\"Turn up the music!\" is a [Directive|Constative|Commissive|Acknowledgment]"
    - "\"What day in May do you want to travel?\" is a [Directive|Constative|Commissive|Acknowledgment]"
    - "\"I will arrange the booking for you.\" is a [Commissive|Constative|Directive|Acknowledgment]"
    - "\"I need to travel in May.\" is a [Constative|Directive|Commissive|Acknowledgment]"
    - "\"Thanks\" is an [Acknowledgment|Constative|Directive|Commissive]"
  explanation: |
    - **Directive**: the speaker tries to get the hearer to do something. This
    covers questions, too: asking is an attempt to get the hearer to answer.
    Students may say constative because nothing is ordered; discuss why.
    - **Commissive**: the speaker commits to a future course of action.
    - **Constative**: states something about the speaker's situation. In
      context it may also work as an indirect request, a good point to discuss.
    - **Acknowledgment**: expresses an attitude towards the hearer regarding a
      social action (thanking).
