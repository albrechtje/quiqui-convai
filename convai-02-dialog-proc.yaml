# Chapter 02

# Slide: Vectorization with TF-IDF (sparse vs. dense vectors)

- question: |
    A corpus of thousands of news articles is vectorized by a TF vectorizer.

    If you look at one specific article, what is true for its TF vector?
  type: multiple
  answers:
    - "Its dimensionality is determined by the length of this article."
    - "Most entries are zero"
    - "Two articles with different texts can have the identical vector."
    - "Cosine similarity of two vectors can be negative."
  correct:
    - B
    - C
  explanation: |
    **A sparse count vector: one dimension per corpus word, no word order.**

    - **A** wrong: the dimensionality is the vocabulary size, the same for every article.
    - **B** correct: an article uses only a small part of the vocabulary (sparse).
    - **C** correct: only counts matter, so "dog bites man" = "man bites dog".
    - **D** wrong: counts are non-negative, so the cosine lies between 0 and 1.

# Slide: Transformer Encoder (BERT) (contextual embeddings vs. TF vectors)

- question: |
    A transformer encoder (e.g. BERT) processes a sequence of tokens.

    What is true for the produced embeddings?
  type: multiple
  answers:
    - "The encoder produces a number of vectors, one per input token."
    - "Each vector has one dimension per word of the corpus vocabulary."
    - "Most entries of a vector are zero."
    - "The same words in a different order can lead to different vectors."
    - "The transformed embeddings of \"car\" and \"automobile\" can end up with similar vectors."
  correct:
    - A
    - D
    - E
  explanation: |
    **One dense, contextual vector per input token.**

    - **A** correct: one meaningful vector per input token; padding is only for batching.
    - **B** wrong: the size is fixed by the model, not by the vocabulary (that is TF-IDF).
    - **C** wrong: embeddings are dense, nearly every entry is non-zero.
    - **D** correct: attention depends on position, so a different order changes the vectors.
    - **E** correct: similar meaning gives similar embeddings, which TF-IDF cannot do.

# Slide: Example: Rasa Forms (frames vs. FSM, over-answering)

- question: |
    A flight bot asks: "Where do you want to fly to?"

    The user answers: "From Nuremberg to Berlin on Friday."

    How do a plain FSM and a frame-based (form) dialogue manager typically react?
  type: single
  answers:
    - "Both fill all three slots and continue with the next missing one."
    - "The frame fills all three slots, the FSM only takes the destination."
    - "The FSM fills all three slots, the frame only takes the destination."
    - "Both reject the answer, because it does not match the question."
  correct: B
  explanation: |
    **A frame extracts one or more values per utterance; an FSM state expects one answer.**

    - **A** wrong: an FSM state is tied to one question, it cannot skip ahead on its own.
    - **B** correct: the frame fills origin, destination and date and asks only for the rest.
    - **C** wrong: reversed; the frame is the one that handles over-answering.
    - **D** wrong: neither has to reject; the answer contains the expected destination.

# Slide: Rasa CALM: Flow processing (who decides what happens next)

- question: |
    In Rasa CALM, who decides what happens next in the conversation?
  type: single
  answers:
    - "The LLM chooses the next step, the flow engine only executes it."
    - "The flow engine follows the defined flows, the LLM only issues commands."
    - "An intent classifier maps each message to the next action."
    - "The user, because every message starts a new flow."
  correct: B
  explanation: |
    **The LLM interprets the user (commands), the flow engine decides (business logic).**

    - **A** wrong: this is the common misconception; the LLM does not control the flow.
    - **B** correct: "any logic of what happens afterwards is handled by the flow engine".
    - **C** wrong: CALM replaces the NLU intent classifier by LLM-based dialogue understanding.
    - **D** wrong: a message can start a flow, but the flow then defines the steps.
