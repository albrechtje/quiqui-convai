# Chapter 02

# Slide: Vectorization with TF-IDF (sparse vs. dense vectors)

- question: |
    A corpus of thousands of news articles is vectorized by a TF vectorizer.

    If you look at one specific article, what is true for its TF vector?
  type: multiple
  answers:
    - "Its length is determined by the length of this article."
    - "Most entries are zero"
    - "Two articles with different texts can have the identical vector."
    - "Cosine similarity of two vectors can be negative."
  correct:
    - B
    - C
  explanation: |
    **A sparse count vector: one dimension per corpus word, no word order.**

    - **A** wrong: the length is the vocabulary size, the same for every article.
    - **B** correct: an article uses only a small part of the vocabulary (sparse).
    - **C** correct: only counts matter, so "dog bites man" = "man bites dog".
    - **D** wrong: counts are non-negative, so the cosine lies between 0 and 1.

# Slide: Transformer Encoder (BERT) (contextual embeddings vs. TF vectors)

- question: |
    A transformer encoder (e.g. BERT) processes a sequence of tokens.

    What is true for the produced embeddings?
  type: multiple
  answers:
    - "The encoder produces a number of vectors, one per input token."
    - "Each vector has one dimension per word of the corpus vocabulary."
    - "Most entries of a vector are zero."
    - "The same words in a different order can lead to different vectors."
    - "The transformed embeddings of \"car\" and \"automobile\" can end up with similar vectors."
  correct:
    - A
    - D
    - E
  explanation: |
    **One dense, contextual vector per input token.**

    - **A** correct: one meaningful vector per input token; padding is only for batching.
    - **B** wrong: the size is fixed by the model, not by the vocabulary (that is TF-IDF).
    - **C** wrong: embeddings are dense, nearly every entry is non-zero.
    - **D** correct: attention depends on position, so a different order changes the vectors.
    - **E** correct: similar meaning gives similar embeddings, which TF-IDF cannot do.
